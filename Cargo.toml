[package]
name = "hd-movies"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
description = "A durable HD movie feed scanner and Transmission queue client"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "json", "rustls-tls", "socks"] }
rusqlite = { version = "0.38", features = ["bundled"] }
scraper = "0.25"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
